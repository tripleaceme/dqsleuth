[project]
name = "dqsleuth"
version = "0.1.0"
description = "Read-only MCP server that helps AI assistants investigate data quality problems: profiling, duplicates, freshness, join integrity, metric-drop attribution and dbt test failures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ayoade Adegbite" }]
keywords = ["mcp", "data-quality", "duckdb", "dbt", "analytics-engineering", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Database",
  "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=2.3,<3", "duckdb>=1.1"]

[project.urls]
Homepage = "https://github.com/tripleaceme/dqsleuth"
Issues = "https://github.com/tripleaceme/dqsleuth/issues"

[project.scripts]
dqsleuth = "dqsleuth.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [".claude-plugin", "skills", "examples/*.duckdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
